<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Power-Up Boxing Ring</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            margin: 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255,51,51,0.5);
        }

        #ui-container {
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        select, button {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        select:hover, button:hover {
            background: #333;
            border-color: #ff3333;
        }

        #game-wrapper {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            border-radius: 6px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #222;
        }

        #controls-guide {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            line-height: 1.4;
        }

        .hud-overlay {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .bar-container {
            width: 220px;
            background: rgba(0,0,0,0.6);
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .bar-label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .bar {
            height: 14px;
            border-radius: 3px;
            transition: width 0.1s ease;
        }

        .hp-bar { background: #ff3333; }
        .stamina-bar { background: #33ccff; }
        
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 500px;
            background: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #screen-overlay h2 {
            font-size: 40px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>Ring Masters 2D</h1>

    <div id="ui-container">
        <div>
            <label for="difficulty">Bot Difficulty: </label>
            <select id="difficulty">
                <option value="easy">Sparring Partner (Easy)</option>
                <option value="medium" selected>Contender (Medium)</option>
                <option value="hard">Champion (Hard)</option>
            </select>
        </div>
        <button id="start-btn" onclick="resetGame()">New Match</button>
    </div>

    <div id="game-wrapper">
        <!-- HUD -->
        <div class="hud-overlay">
            <div class="bar-container">
                <div class="bar-label"><span>PLAYER (Blue)</span><span id="p1-hp-txt">100</span></div>
                <div class="bar hp-bar" id="p1-hp" style="width: 100%;"></div>
                <div class="bar stamina-bar" id="p1-stam" style="width: 100%; margin-top:4px;"></div>
            </div>
            <div class="bar-container" style="text-align: right;">
                <div class="bar-label"><span>BOT (Red)</span><span id="p2-hp-txt">100</span></div>
                <div class="bar hp-bar" id="p2-hp" style="width: 100%; float: right;"></div>
                <div class="bar stamina-bar" id="p2-stam" style="width: 100%; margin-top:4px; float: right;"></div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="screen-overlay">
            <h2 id="overlay-title">Ready to Rumble?</h2>
            <button style="font-size: 18px; padding: 10px 20px;" onclick="resetGame()">Fight!</button>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="controls-guide">
        <strong>Controls:</strong> Arrow Keys / WASD to Move & Dodge | <strong>Spacebar</strong> to Throw a Punch!<br>
        Collect colored orbs for ⚡ Speed, 🩸 Healing, or 🔥 Mega Damage Boosts.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let gameActive = false;
        let difficulty = 'medium';
        let powerups = [];
        let particles = [];
        let combatTexts = [];
        let nextPowerupTimer = 180; 

        // Ring Configuration Boundaries
        const ring = {
            x: 100,
            y: 80,
            width: 600,
            height: 340
        };

        // Entities Setup
        class Fighter {
            constructor(x, y, color, isBot) {
                this.x = x;
                this.y = y;
                this.radius = 24;
                this.color = color;
                this.isBot = isBot;
                this.baseSpeed = 4;
                this.speed = 4;
                this.maxHp = 100;
                this.hp = 100;
                this.maxStamina = 100;
                this.stamina = 100;
                
                this.angle = 0; 
                this.isPunching = false;
                this.punchProgress = 0;
                this.punchHand = 'left'; 
                this.damageMultiplier = 1;
                
                // Status Timers
                this.powerupTimers = { speed: 0, mega: 0 };
                this.aiDecisionTimer = 0;
                this.aiTargetX = x;
                this.aiTargetY = y;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Draw Active Buff Aura Effects
                if (this.powerupTimers.speed > 0) {
                    ctx.strokeStyle = 'rgba(255, 235, 59, 0.4)';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (this.powerupTimers.mega > 0) {
                    ctx.strokeStyle = 'rgba(244, 67, 54, 0.4)';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Fighter Torso Base
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Boxing Gloves Graphic calculation
                let leftGloveY = -this.radius + 4;
                let rightGloveY = this.radius - 4;
                let gloveX = this.radius - 4;

                if (this.isPunching) {
                    let punchExtension = Math.sin(this.punchProgress * Math.PI) * 22;
                    if (this.punchHand === 'left') leftGloveY -= punchExtension;
                    if (this.punchHand === 'right') rightGloveY += punchExtension;
                    gloveX += punchExtension * 0.6;
                }

                // Render Gloves
                ctx.fillStyle = '#ff1744';
                if(this.color === '#f44336') ctx.fillStyle = '#2979ff'; // Swap glove style dynamically
                
                // Left Glove
                ctx.beginPath(); ctx.arc(gloveX, leftGloveY, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                // Right Glove
                ctx.beginPath(); ctx.arc(gloveX, rightGloveY, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                ctx.restore();
            }

            update() {
                // Decay powerups
                if (this.powerupTimers.speed > 0) {
                    this.powerupTimers.speed--;
                    this.speed = this.baseSpeed * 1.6;
                } else {
                    this.speed = this.baseSpeed;
                }
                if (this.powerupTimers.mega > 0) this.powerupTimers.mega--;

                // Natural Stamina Regen
                if (!this.isPunching && this.stamina < this.maxStamina) {
                    this.stamina = Math.min(this.maxStamina, this.stamina + 0.4);
                }

                // Handle Punch Animations
                if (this.isPunching) {
                    this.punchProgress += 0.15;
                    if (this.punchProgress >= 1) {
                        this.isPunching = false;
                        this.punchProgress = 0;
                    }
                }

                // Prevent ring escapes
                this.x = Math.max(ring.x + this.radius, Math.min(ring.x + ring.width - this.radius, this.x));
                this.y = Math.max(ring.y + this.radius, Math.min(ring.y + ring.height - this.radius, this.y));
            }

            throwPunch() {
                if (this.isPunching || this.stamina < 20) return;
                this.isPunching = true;
                this.punchProgress = 0;
                this.punchHand = Math.random() > 0.5 ? 'left' : 'right';
                this.stamina -= 20;

                // Hit Detection Check
                let opponent = this.isBot ? player : bot;
                let targetAngle = Math.atan2(opponent.y - this.y, opponent.x - this.x);
                let angleDiff = Math.abs(this.angle - targetAngle);
                
                // Normalize angle variations
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                let dist = Math.hypot(opponent.x - this.x, opponent.y - this.y);
                
                // If in range and looking at opponent
                if (dist < this.radius * 2.5 + opponent.radius && angleDiff < 0.6) {
                    let dmg = Math.floor(Math.random() * 6) + 8;
                    if (this.powerupTimers.mega > 0) dmg *= 2;
                    if (this.stamina < 30) dmg = Math.floor(dmg * 0.6); // Fatigued penalty

                    opponent.hp = Math.max(0, opponent.hp - dmg);
                    createHitEffect(opponent.x, opponent.y, this.powerupTimers.mega > 0 ? '#ff3333' : '#fff');
                    combatTexts.push({x: opponent.x, y: opponent.y - 30, text: `-${dmg}`, timer: 40, color: this.powerupTimers.mega > 0 ? '#ff1744' : '#fff'});
                }
            }
        }

        const player = new Fighter(250, 250, '#2196f3', false);
        const bot = new Fighter(550, 250, '#f44336', true);

        // Control Mappings Keyboard listeners
        const keys = {};
        window.addEventListener('keydown', e => { 
            keys[e.key.toLowerCase()] = true; 
            if(e.key === ' ' || e.code === 'Space') {
                player.throwPunch();
            }
        });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

        function handlePlayerInput() {
            let dx = 0;
            let dy = 0;

            if (keys['w'] || keys['arrowup']) dy = -1;
            if (keys['s'] || keys['arrowdown']) dy = 1;
            if (keys['a'] || keys['arrowleft']) dx = -1;
            if (keys['d'] || keys['arrowright']) dx = 1;

            if (dx !== 0 || dy !== 0) {
                let length = Math.hypot(dx, dy);
                player.x += (dx / length) * player.speed;
                player.y += (dy / length) * player.speed;
            }

            // Always track face direction toward bot target
            player.angle = Math.atan2(bot.y - player.y, bot.x - player.x);
        }

        function handleBotAI() {
            bot.aiDecisionTimer--;
            let dist = Math.hypot(player.x - bot.x, player.y - bot.y);

            // Change direction strategy based on selected difficulty settings
            if (bot.aiDecisionTimer <= 0) {
                difficulty = document.getElementById('difficulty').value;
                if (difficulty === 'easy') {
                    bot.aiDecisionTimer = 40 + Math.random() * 40;
                    // Wander randomly or pursue loosely
                    if (Math.random() > 0.4) {
                        bot.aiTargetX = player.x + (Math.random() * 160 - 80);
                        bot.aiTargetY = player.y + (Math.random() * 160 - 80);
                    } else {
                        bot.aiTargetX = Math.random() * ring.width + ring.x;
                        bot.aiTargetY = Math.random() * ring.height + ring.y;
                    }
                } else if (difficulty === 'medium') {
                    bot.aiDecisionTimer = 20 + Math.random() * 30;
                    bot.aiTargetX = player.x + (Math.random() * 80 - 40);
                    bot.aiTargetY = player.y + (Math.random() * 80 - 40);
                } else { // Hard Mode Aggressive behavior tracking
                    bot.aiDecisionTimer = 5 + Math.random() * 10;
                    bot.aiTargetX = player.x + (Math.random() * 30 - 15);
                    bot.aiTargetY = player.y + (Math.random() * 30 - 15);
                }
            }

            // Always chase nearest Powerups if reasonably close
            if (powerups.length > 0) {
                let closestPU = powerups[0];
                let pDist = Math.hypot(closestPU.x - bot.x, closestPU.y - bot.y);
                if (pDist < 250 && difficulty !== 'easy') {
                    bot.aiTargetX = closestPU.x;
                    bot.aiTargetY = closestPU.y;
                }
            }

            // Execute movements
            let tx = bot.aiTargetX - bot.x;
            let ty = bot.aiTargetY - bot.y;
            let tDist = Math.hypot(tx, ty);
            if (tDist > 5) {
                bot.x += (tx / tDist) * bot.speed;
                bot.y += (ty / tDist) * bot.speed;
            }

            bot.angle = Math.atan2(player.y - bot.y, player.x - bot.x);

            // Punch Logic Thresholds
            if (dist < bot.radius * 2.4 + player.radius) {
                let punchChance = difficulty === 'easy' ? 0.02 : difficulty === 'medium' ? 0.05 : 0.09;
                if (Math.random() < punchChance) {
                    bot.throwPunch();
                }
            }
        }

        // Spawning Logic System
        function managePowerups() {
            nextPowerupTimer--;
            if (nextPowerupTimer <= 0) {
                const types = ['speed', 'heal', 'mega'];
                const chosenType = types[Math.floor(Math.random() * types.length)];
                powerups.push({
                    x: Math.random() * (ring.width - 60) + ring.x + 30,
                    y: Math.random() * (ring.height - 60) + ring.y + 30,
                    type: chosenType,
                    radius: 12,
                    pulse: 0
                });
                nextPowerupTimer = 220 + Math.random() * 180; // 3-6 seconds windows
            }

            // Evaluate Collision Items collected
            for (let i = powerups.length - 1; i >= 0; i--) {
                let pu = powerups[i];
                pu.pulse += 0.1;

                [player, bot].forEach(fighter => {
                    let dist = Math.hypot(fighter.x - pu.x, fighter.y - pu.y);
                    if (dist < fighter.radius + pu.radius) {
                        // Apply Buff Matrix
                        if (pu.type === 'speed') fighter.powerupTimers.speed = 300; // 5 seconds
                        if (pu.type === 'mega') fighter.powerupTimers.mega = 240; // 4 seconds
                        if (pu.type === 'heal') fighter.hp = Math.min(fighter.maxHp, fighter.hp + 30);
                        
                        // FX Splash Burst
                        createHitEffect(pu.x, pu.y, pu.type === 'speed' ? '#ffeb3b' : pu.type === 'heal' ? '#4caf50' : '#f44336');
                        combatTexts.push({x: pu.x, y: pu.y - 20, text: pu.type.toUpperCase(), timer: 50, color: '#fff'});

                        powerups.splice(i, 1);
                    }
                });
            }
        }

        function createHitEffect(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 2,
                    alpha: 1,
                    color: color
                });
            }
        }

        // Draw Environment Objects
        function drawRing() {
            // Canvas Neutral background details
            ctx.fillStyle = '#1c1c1c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Spotlight canvas canvas background shadows
            let grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, 400);
            grad.addColorStop(0, 'rgba(40,40,45,1)');
            grad.addColorStop(1, 'rgba(15,15,15,1)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0, canvas.width, canvas.height);

            // Ring Canvas Area
            ctx.fillStyle = '#3a3a42';
            ctx.fillRect(ring.x, ring.y, ring.width, ring.height);
            ctx.strokeStyle = '#d1d1d1';
            ctx.lineWidth = 6;
            ctx.strokeRect(ring.x, ring.y, ring.width, ring.height);

            // Inner Red/Blue Corners guidelines
            ctx.strokeStyle = 'rgba(244, 67, 54, 0.4)';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(ring.x, ring.y); ctx.lineTo(ring.x + 80, ring.y);
            ctx.lineTo(ring.x, ring.y + 80); ctx.closePath(); ctx.stroke();

            ctx.strokeStyle = 'rgba(33, 150, 243, 0.4)';
            ctx.beginPath(); ctx.moveTo(ring.x + ring.width, ring.y + ring.height);
            ctx.lineTo(ring.x + ring.width - 80, ring.y + ring.height);
            ctx.lineTo(ring.x + ring.width, ring.y + ring.height - 80); ctx.closePath(); ctx.stroke();

            // Center Ring Logo Circle Design
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 60, 0, Math.PI*2); ctx.stroke();
        }

        function drawPowerups() {
            powerups.forEach(pu => {
                ctx.save();
                let pulseSize = pu.radius + Math.sin(pu.pulse) * 3;
                
                // Outer glow glow element
                ctx.shadowBlur = 10;
                ctx.shadowColor = pu.type === 'speed' ? '#ffeb3b' : pu.type === 'heal' ? '#4caf50' : '#f44336';
                ctx.fillStyle = ctx.shadowColor;
                
                ctx.beginPath();
                ctx.arc(pu.x, pu.y, pulseSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function updateHUD() {
            document.getElementById('p1-hp').style.width = `${player.hp}%`;
            document.getElementById('p1-hp-txt').innerText = player.hp;
            document.getElementById('p1-stam').style.width = `${player.stamina}%`;

            document.getElementById('p2-hp').style.width = `${bot.hp}%`;
            document.getElementById('p2-hp-txt').innerText = bot.hp;
            document.getElementById('p2-stam').style.width = `${bot.stamina}%`;

            // Evaluate Match End States
            if ((player.hp <= 0 || bot.hp <= 0) && gameActive) {
                gameActive = false;
                document.getElementById('screen-overlay').style.display = 'flex';
                document.getElementById('overlay-title').innerText = player.hp <= 0 ? '❌ KO! Bot Wins' : '🏆 Victory! You Win';
            }
        }

        // Primary Runtime Loop Sequence 
        function gameLoop() {
            if (gameActive) {
                handlePlayerInput();
                handleBotAI();
                player.update();
                bot.update();
                managePowerups();
            }

            // Redraw Scenes Frame
            drawRing();
            drawPowerups();
            player.draw();
            bot.draw();

            // Render active tracking FX layers
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                if (p.alpha <= 0) particles.splice(i, 1);
                else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
                }
            }
            ctx.globalAlpha = 1.0; // Reset canvas transparency baseline

            // Floating Text render loops
            for (let i = combatTexts.length - 1; i >= 0; i--) {
                let ct = combatTexts[i];
                ct.y -= 0.5; ct.timer--;
                if (ct.timer <= 0) combatTexts.splice(i, 1);
                else {
                    ctx.fillStyle = ct.color;
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillText(ct.text, ct.x - 10, ct.y);
                }
            }

            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            player.hp = 100; player.stamina = 100;
            player.x = 250; player.y = 250;
            player.powerupTimers = { speed: 0, mega: 0 };
            
            bot.hp = 100; bot.stamina = 100;
            bot.x = 550; bot.y = 250;
            bot.powerupTimers = { speed: 0, mega: 0 };

            powerups = []; particles = []; combatTexts = [];
            nextPowerupTimer = 100;
            
            document.getElementById('screen-overlay').style.display = 'none';
            gameActive = true;
        }

        // Kick off engine loops initially
        gameLoop();
    </script>
</body>
</html>
