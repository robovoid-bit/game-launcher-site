<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Drift Racer 3D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at top, #202040 0%, #050509 60%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            text-shadow: 0 0 10px #00ffff;
        }
        #hud h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #00ffff;
            letter-spacing: 2px;
        }
        .hud-line {
            font-size: 16px;
            margin-bottom: 4px;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #00ffff;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="hud">
    <h1>NEON DRIFT RACER</h1>
    <div class="hud-line">Speed: <span id="speed">0</span> km/h</div>
    <div class="hud-line">Gear: <span id="gear">1</span></div>
    <div class="hud-line">RPM: <span id="rpm">0</span></div>
</div>
<div id="instructions">
    W / S = Throttle & Brake · A / D = Steer · Q / E = Gear Down / Up · SPACE = Handbrake Drift
</div>

<script>
if (typeof THREE === 'undefined') {
    document.body.innerHTML = "<h2 style='color:white;padding:20px;'>Error: Could not load Three.js.</h2>";
}

// --- Core vars ---
let scene, camera, renderer;
let car, carBody, carGroup;
let track;
let clock = new THREE.Clock();

const keys = {
    w: false, a: false, s: false, d: false,
    q: false, e: false, ' ': false
};

let speed = 0;          // forward speed (units/s)
let gear = 1;           // 1–5
let rpm = 0;
let maxGears = 5;

let heading = 0;        // car yaw
let driftAngle = 0;     // sideways slip
let steerInput = 0;

const gearData = [
    { gear: 1, accel: 18, maxSpeed: 60 },
    { gear: 2, accel: 14, maxSpeed: 110 },
    { gear: 3, accel: 11, maxSpeed: 160 },
    { gear: 4, accel: 9,  maxSpeed: 210 },
    { gear: 5, accel: 7,  maxSpeed: 260 }
];

const frictionBase = 4.0;
const driftFriction = 1.2;
const handbrakeFriction = 0.6;

// --- Input ---
window.addEventListener('keydown', e => {
    if (e.key in keys) keys[e.key] = true;
});
window.addEventListener('keyup', e => {
    if (e.key in keys) keys[e.key] = false;
});

// --- Init ---
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050509);
    scene.fog = new THREE.FogExp2(0x050509, 0.02);

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 8, -15);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    addLights();
    createTrack();
    createCar();

    window.addEventListener('resize', onWindowResize);

    animate();
}

function addLights() {
    const ambient = new THREE.AmbientLight(0x4040ff, 0.6);
    scene.add(ambient);

    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(30, 50, -20);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    scene.add(dir);

    const neon1 = new THREE.PointLight(0x00ffff, 1.2, 80);
    neon1.position.set(0, 10, 0);
    scene.add(neon1);

    const neon2 = new THREE.PointLight(0xff007f, 1.0, 80);
    neon2.position.set(40, 8, 40);
    scene.add(neon2);
}

function createTrack() {
    const trackGeo = new THREE.PlaneGeometry(200, 200, 40, 40);
    const trackMat = new THREE.MeshStandardMaterial({
        color: 0x111118,
        roughness: 0.9,
        metalness: 0.1
    });
    track = new THREE.Mesh(trackGeo, trackMat);
    track.rotation.x = -Math.PI / 2;
    track.receiveShadow = true;
    scene.add(track);

    const grid = new THREE.GridHelper(200, 40, 0x00ffff, 0x222244);
    grid.position.y = 0.02;
    scene.add(grid);

    // Simple neon barriers
    const barrierMat = new THREE.MeshStandardMaterial({
        color: 0xff007f,
        emissive: 0xff007f,
        emissiveIntensity: 0.7
    });
    const barrierGeo = new THREE.BoxGeometry(200, 1, 1);
    const b1 = new THREE.Mesh(barrierGeo, barrierMat);
    b1.position.set(0, 0.5, 100);
    const b2 = b1.clone(); b2.position.set(0, 0.5, -100);
    const b3 = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 200), barrierMat);
    b3.position.set(100, 0.5, 0);
    const b4 = b3.clone(); b4.position.set(-100, 0.5, 0);
    scene.add(b1, b2, b3, b4);
}

function createCar() {
    carGroup = new THREE.Group();

    const bodyGeo = new THREE.BoxGeometry(2.2, 0.6, 4.0);
    const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x003333,
        emissiveIntensity: 0.8,
        metalness: 0.4,
        roughness: 0.2
    });
    carBody = new THREE.Mesh(bodyGeo, bodyMat);
    carBody.castShadow = true;
    carBody.position.y = 0.6;
    carGroup.add(carBody);

    const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
    const wheelMat = new THREE.MeshStandardMaterial({
        color: 0x111111,
        metalness: 0.3,
        roughness: 0.7
    });

    function makeWheel(x, z) {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(x, 0.3, z);
        w.castShadow = true;
        return w;
    }

    carGroup.add(
        makeWheel(-1.1, 1.5),
        makeWheel(1.1, 1.5),
        makeWheel(-1.1, -1.5),
        makeWheel(1.1, -1.5)
    );

    carGroup.position.set(0, 0, 0);
    scene.add(carGroup);

    car = carGroup;
}

// --- Physics & drift ---
function updateCar(dt) {
    const g = gearData[gear - 1];

    // Steering
    steerInput = 0;
    if (keys.a) steerInput = 1;
    if (keys.d) steerInput = -1;

    const steerStrength = 1.8; // radians/sec at full steer
    heading += steerInput * steerStrength * dt * (speed / 80);

    // Throttle / brake
    let accel = 0;
    if (keys.w) accel += g.accel;
    if (keys.s) accel -= g.accel * 1.2;

    // Handbrake drift
    let friction = frictionBase;
    if (keys[' ']) {
        friction = handbrakeFriction;
        driftAngle += steerInput * 3.0 * dt;
    } else {
        driftAngle *= 0.95;
    }

    // Apply accel & friction
    speed += accel * dt;
    const maxSpeed = g.maxSpeed;
    if (speed > maxSpeed) speed = maxSpeed;
    if (speed < -40) speed = -40;

    const drag = friction * dt;
    if (!keys.w && !keys.s) {
        if (speed > 0) speed = Math.max(0, speed - drag * 10);
        else if (speed < 0) speed = Math.min(0, speed + drag * 10);
    }

    // Drift slip
    const slipFactor = keys[' '] ? 0.35 : 0.12;
    const forwardHeading = heading;
    const driftHeading = heading + driftAngle * slipFactor;

    const rad = driftHeading * Math.PI / 180;
    const vx = Math.sin(rad) * speed * dt;
    const vz = Math.cos(rad) * speed * dt;

    car.position.x += vx;
    car.position.z += vz;

    car.rotation.y = forwardHeading * Math.PI / 180;

    // Clamp to track bounds
    const limit = 95;
    car.position.x = Math.max(-limit, Math.min(limit, car.position.x));
    car.position.z = Math.max(-limit, Math.min(limit, car.position.z));

    // RPM calc (fake but feels right)
    rpm = Math.floor((Math.abs(speed) / maxSpeed) * 7000);
    rpm = Math.max(800, Math.min(9000, rpm));

    // HUD update
    document.getElementById('speed').innerText = Math.floor(Math.abs(speed));
    document.getElementById('gear').innerText = gear;
    document.getElementById('rpm').innerText = rpm;
}

// --- Gear shifting ---
function handleGears() {
    if (keys.q) {
        if (gear > 1) gear--;
        keys.q = false;
    }
    if (keys.e) {
        if (gear < maxGears) gear++;
        keys.e = false;
    }
}

// --- Camera follow ---
function updateCamera(dt) {
    const targetPos = new THREE.Vector3(
        car.position.x,
        car.position.y + 3,
        car.position.z
    );

    const backOffset = 10;
    const heightOffset = 4;

    const yawRad = car.rotation.y;
    const camX = targetPos.x - Math.sin(yawRad) * backOffset;
    const camZ = targetPos.z - Math.cos(yawRad) * backOffset;
    const camY = targetPos.y + heightOffset;

    camera.position.x += (camX - camera.position.x) * 5 * dt;
    camera.position.y += (camY - camera.position.y) * 5 * dt;
    camera.position.z += (camZ - camera.position.z) * 5 * dt;

    camera.lookAt(targetPos);
}

// --- Main loop ---
function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    handleGears();
    updateCar(dt);
    updateCamera(dt);

    renderer.render(scene, camera);
}

// --- Resize ---
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- Start ---
window.onload = init;
</script>
</body>
</html>
