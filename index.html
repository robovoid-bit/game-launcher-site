<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Drive - Personal Storage</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }
        .hidden-trigger { position: absolute; bottom: 10px; right: 10px; width: 20px; height: 20px; opacity: 0.1; cursor: pointer; background: #000; }
        #decoy-content { padding: 50px; text-align: center; color: #333; }
    </style>
</head>
<body>

    <!-- DECOY CONTENT: Keeps the page looking safe until you trigger it -->
    <div id="decoy-content">
        <img src="https://wikimedia.org" width="80" alt="Drive Box"><br>
        <h2>My School Storage Portfolio</h2>
        <p>Loading document sync vectors from student cloud directory...</p>
        
        <!-- Invisible activation button in the bottom corner -->
        <div class="hidden-trigger" onclick="launchUnblockedPortal()"></div>
    </div>

    <!-- THE UNBLOCKED PROXY VIEWPORT -->
    <div id="portal-frame-container" style="display:none; width:100%; height:100%;">
        <iframe id="proxy-viewport" src=""></iframe>
    </div>

    <script>
        // Points directly to the built-in deployment path on your GitHub Pages repo
        const MY_SECRET_PROXY_URL = window.location.href + "uv/index.html";

        function launchUnblockedPortal() {
            // Hide the decoy page layout immediately
            document.getElementById('decoy-content').style.display = 'none';
            
            // Open the internal proxy page
            const container = document.getElementById('portal-frame-container');
            const iframe = document.getElementById('proxy-viewport');
            
            container.style.display = 'block';
            iframe.src = MY_SECRET_PROXY_URL;
            
            // Instantly mask the browser tab title and favicon to appear like Google Docs
            document.title = "Google Docs";
            let link = document.querySelector("link[rel~='icon']");
            if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                document.head.appendChild(link);
            }
            link.href = "https://gstatic.com";
        }
    </script>
</body>
</html>
