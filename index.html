<html lang="en" crxlauncher=""><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Buttons</title>
    <style>
        /* --------------------------------------------------
           EDIT YOUR CHOICES HERE (COLORS, SIZES)
        -------------------------------------------------- */
        :root {
            /* Background Card Settings */
                --card-bg-color: #3d3d3d;
                --card-width: 700px;
                --card-padding: 200px;
                --card-border-radius: 20px;
                --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);

            /* Button 1 (Top Link Button) Settings */
            --btn1-bg-color: #ffa500;      /* Background color */
            --btn1-text-color: #3d3d3d;    /* Text color */
            --btn1-text-size: 16px;        /* Font size */
            --btn1-border-radius: 12px;   /* How rounded the button corners are */

            /* Button 2 (Bottom Close Button) Settings */
            --btn2-bg-color: #1a1a1a;      /* Background color */
            --btn2-text-color: #ffffff;    /* Text color */
            --btn2-text-size: 16px;        /* Font size */
            --btn2-border-radius: 12px;   /* How rounded the button corners are */

            /* Outer Page Settings */
            --page-bg-color: #f0f2f5;      /* Overall website background color */
        }

        /* --------------------------------------------------
           CORE LAYOUT STYLES (DO NOT NEED TO EDIT)
        -------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--page-bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container-card {
            background-color: var(--card-bg-color);
            width: 100%;
            max-width: var(--card-width);
            padding: var(--card-padding);
            border-radius: var(--card-border-radius);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spacing between the buttons */
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .top-link-btn {
            background-color: var(--btn1-bg-color);
            color: var(--btn1-text-color);
            font-size: var(--btn1-text-size);
            border-radius: var(--btn1-border-radius);
        }

        .bottom-close-btn {
            background-color: var(--btn2-bg-color);
            color: var(--btn2-text-color);
            font-size: var(--btn2-text-size);
            border-radius: var(--btn2-border-radius);
        }
    </style>
<style></style></head>
<body>

    <!-- THE BACKGROUND CARD -->
    <div class="container-card">

        <!-- TOP BUTTON: Takes you to the Rickroll link -->
        <a href="https://youtu.be/dQw4w9WgXcQ?t=0" target="_blank" class="btn top-link-btn">Im 18 or older: enter</a>

        <!-- BOTTOM BUTTON: Closes the site -->
        <button onclick="closeWindow()" class="btn bottom-close-btn">
           im under 17: exit    </button>

    </div>

    <script>
        function closeWindow() {
            window.close();
            setTimeout(() => {
                document.body.innerHTML = '<div style="font-family:sans-serif; text-align:center; padding:50px; color:#666;"><h3>You can now close this tab.</h3></div>';
            }, 100);
        }
    </script>




</body></html>
